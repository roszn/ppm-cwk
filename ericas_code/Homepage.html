<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/Homepage.css">
</head>
<body class="dashboard-body">

    <div class="dashboard-container">
        <div class="column events-col">
            <div class="glass-panel">
                <h2 class="section-title">Upcoming Events</h2>
                
                <div class="event-card">
                    <div class="event-header">Bank Holiday <span class="dot"></span></div>
                    <div class="event-date">Week 23 Monday 1 May</div>
                </div>

                <div class="event-card">
                    <div class="event-header">Payday <span class="dot"></span></div>
                    <div class="event-date">Week 14 27 March</div>
                </div>

                <div class="event-card">
                    <div class="event-header">Easter Monday <span class="dot"></span></div>
                    <div class="event-date">Monday 6 April</div>
                </div>
            </div>
        </div>

        <div class="column center-col">
            <div class="welcome-section">
                <h1>Welcome, User! <span class="circle-icon"></span></h1>
            </div>

            <div class="leave-status">
                <h3>View Leave Status <i class="fas fa-sign-out-alt lime-text"></i></h3>
                <p>No notifications</p>
            </div>

            <div class="calendar-card">
                <h3>View Calendar</h3>
                <div class="calendar-content">
                    <span class="dot"></span> 1 New
                    <i class="far fa-calendar-alt fa-3x"></i>
                </div>
            </div>

            <div class="social-footer">
                <img src="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120" alt="FDM" class="fdm-logo">
                <div class="icons">
                    <i class="fab fa-instagram"></i>
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-twitter"></i>
                </div>
            </div>
        </div>

        <div class="column profile-col">
            <div class="profile-header">
                <div class="avatar-circle">
                    <i class="fas fa-user"></i>
                </div>
                <h2>User</h2>
            </div>

            <div class="profile-menu">
                <div class="menu-item gray"></div>
                <div class="menu-item active"><span class="dot"></span></div>
                <div class="menu-item lime"></div>
                <div class="menu-item gray"></div>
            </div>

            <div class="profile-links">
                <a href="#" class="logout-link">Log Out</a>
                <div class="sub-links">
                    <a href="#">Edit Profile</a>
                    <a href="#">Change Profile Picture</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
