
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link rel = "shortcut icon" href = "https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247">
    
</head>">
<body>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h4>Login to Portal</h4>
                    </div>
                    <div class="card-body">
                        <!--{% if error %}
                            <div class="alert alert-danger">{{ error }}</div>
                        {% endif %}-->
                        <form id="loginForm" method="post">
                            <!--{% csrf_token %}-->
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="RegisterPage.html">Don't have an account? Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
		
		<P>Copyright &copy; 2026 FDM Portal. All rights reserved &nbsp; Privacy Policy&nbsp;|&nbspLegal&nbsp;|&nbsp; Site Map&nbsp; UK</p> 
		
	</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
