<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM Portal — Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/LoginPage.css">
    <!-- Django: <link rel="stylesheet" href="{% static 'css/LoginPage.css' %}"> -->
    <link rel="shortcut icon" href="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247">
</head>
<body>

    <!-- Rocket canvas background -->
    <canvas id="rocketCanvas"></canvas>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-brand">
            <img src="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247" alt="FDM">
            FDM Group Portal
        </div>
        <div class="top-bar-hint">secure login</div>
    </div>

    <!-- Main Content -->
    <div class="page-wrap">
        <div class="login-card">

            <div class="card-brand">
                <img src="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247" alt="FDM Logo">
                <h1>Sign in</h1>
                <p>Use your FDM account to continue</p>
            </div>

            <!--
            {% if error %}
            <div class="alert-fdm">{{ error }}</div>
            {% endif %}
            -->

            <form id="loginForm" method="post">
                <!-- Django: {% csrf_token %} -->

                <div class="field-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@fdmgroup.com"
                           autocomplete="username" required>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password"
                               placeholder="••••••••"
                               autocomplete="current-password" required>
                        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">👁</button>
                    </div>
                    <div class="forgot-row">
                        <a href="#">Forgot password?</a>
                    </div>
                </div>

                <button type="submit" class="btn-signin">Sign in</button>
            </form>

            <div class="divider"><span>or</span></div>

            <div class="register-row">
                New to FDM? <a href="RegisterPage.html">Create an account</a>
            </div>

        </div>
    </div>

    <footer>
        Copyright &copy; 2026 FDM Portal. All rights reserved &nbsp;&nbsp;
        <a href="#">Privacy Policy</a> &nbsp;|&nbsp;
        <a href="#">Legal</a> &nbsp;|&nbsp;
        <a href="#">Site Map</a> &nbsp; UK
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Django: <script src="{% static 'js/login.js' %}"></script> -->

    <script>
        /* ── Password toggle ── */
        document.getElementById('togglePw').addEventListener('click', function () {
            var pw = document.getElementById('password');
            var hidden = pw.type === 'password';
            pw.type = hidden ? 'text' : 'password';
            this.textContent = hidden ? '🙈' : '👁';
        });

        /* ══════════════════════════════════════
           ROCKET CANVAS — bulletproof loop
           requestAnimationFrame is called FIRST
           inside the frame function so even if
           drawing throws, the loop never dies.
        ══════════════════════════════════════ */
        (function () {
            var canvas = document.getElementById('rocketCanvas');
            var ctx = canvas.getContext('2d');
            var W = 0, H = 0;
            var stars = [];
            var trail = [];
            var t = 0, flameT = 0;
            var prevX = 0, prevY = 0, angle = 0;
            var started = false;

            function setSize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function makeStars() {
                stars = [];
                for (var i = 0; i < 130; i++) {
                    stars.push({
                        x:     Math.random() * W,
                        y:     Math.random() * H,
                        r:     Math.random() * 1.4 + 0.3,
                        alpha: Math.random(),
                        spd:   (Math.random() * 0.012 + 0.003) * (Math.random() < 0.5 ? 1 : -1)
                    });
                }
            }

            /* lemniscate (figure-8) parametric path */
            function getPos(tt) {
                var scale = Math.min(W, H) * 0.36;
                var d = 1 + Math.sin(tt) * Math.sin(tt);
                return {
                    x: W / 2 + scale * Math.cos(tt) / d,
                    y: H / 2 + scale * Math.sin(tt) * Math.cos(tt) / d
                };
            }

            function drawRocket(rx, ry, ang) {
                ctx.save();
                ctx.translate(rx, ry);
                ctx.rotate(ang + Math.PI / 2);

                var rw = 10, rh = 24;
                var ff = 0.7 + Math.sin(flameT) * 0.3;

                /* flame */
                var fg = ctx.createLinearGradient(0, rh * 0.4, 0, rh * 0.4 + 22 * ff);
                fg.addColorStop(0,   'rgba(200,253,20,0.95)');
                fg.addColorStop(0.5, 'rgba(255,150,0,0.75)');
                fg.addColorStop(1,   'rgba(255,50,0,0)');
                ctx.beginPath();
                ctx.moveTo(-rw * 0.35, rh * 0.4);
                ctx.quadraticCurveTo(0, rh * 0.4 + 22 * ff, rw * 0.35, rh * 0.4);
                ctx.fillStyle = fg;
                ctx.fill();

                /* body */
                ctx.beginPath();
                ctx.moveTo(0, -rh / 2);
                ctx.quadraticCurveTo( rw * 0.8, 0,  rw * 0.6,  rh * 0.4);
                ctx.lineTo(-rw * 0.6, rh * 0.4);
                ctx.quadraticCurveTo(-rw * 0.8, 0, 0, -rh / 2);
                ctx.fillStyle = '#d0d0d0';
                ctx.fill();

                /* nose accent */
                ctx.beginPath();
                ctx.moveTo(0, -rh / 2);
                ctx.quadraticCurveTo( rw * 0.4, -rh * 0.1,  rw * 0.2, rh * 0.05);
                ctx.lineTo(-rw * 0.2, rh * 0.05);
                ctx.quadraticCurveTo(-rw * 0.4, -rh * 0.1, 0, -rh / 2);
                ctx.fillStyle = '#c8fd14';
                ctx.fill();

                /* porthole */
                ctx.beginPath();
                ctx.arc(0, rh * 0.05, rw * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = '#1e1e1e';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-rw * 0.06, rh * 0.02, rw * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200,253,20,0.5)';
                ctx.fill();

                /* left fin */
                ctx.beginPath();
                ctx.moveTo(-rw * 0.55, rh * 0.2);
                ctx.lineTo(-rw * 1.15, rh * 0.52);
                ctx.lineTo(-rw * 0.6,  rh * 0.42);
                ctx.closePath();
                ctx.fillStyle = '#c8fd14';
                ctx.fill();

                /* right fin */
                ctx.beginPath();
                ctx.moveTo( rw * 0.55, rh * 0.2);
                ctx.lineTo( rw * 1.15, rh * 0.52);
                ctx.lineTo( rw * 0.6,  rh * 0.42);
                ctx.closePath();
                ctx.fillStyle = '#c8fd14';
                ctx.fill();

                ctx.restore();
            }

            function frame() {
                /* schedule next frame FIRST — loop can never be killed */
                requestAnimationFrame(frame);

                try {
                    ctx.clearRect(0, 0, W, H);

                    /* twinkling stars */
                    for (var i = 0; i < stars.length; i++) {
                        var s = stars[i];
                        s.alpha += s.spd;
                        if (s.alpha >= 1) { s.alpha = 1; s.spd = -Math.abs(s.spd); }
                        if (s.alpha <= 0) { s.alpha = 0; s.spd =  Math.abs(s.spd); }
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + s.alpha + ')';
                        ctx.fill();
                    }

                    /* rocket position along figure-8 */
                    t += 0.004;
                    var pos = getPos(t);
                    angle = Math.atan2(pos.y - prevY, pos.x - prevX);
                    prevX = pos.x;
                    prevY = pos.y;

                    /* trail */
                    trail.push({ x: pos.x, y: pos.y, life: 1.0, r: Math.random() * 2.5 + 1 });
                    for (var j = trail.length - 1; j >= 0; j--) {
                        trail[j].life -= 0.03;
                        if (trail[j].life <= 0) { trail.splice(j, 1); continue; }
                        ctx.beginPath();
                        ctx.arc(trail[j].x, trail[j].y, trail[j].r * trail[j].life, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(200,253,20,' + (trail[j].life * 0.4) + ')';
                        ctx.fill();
                    }

                    flameT += 0.18;
                    drawRocket(pos.x, pos.y, angle);

                } catch (e) {
                    /* silently swallow errors so loop keeps running */
                }
            }

            /* initialise once DOM + layout is fully ready */
            window.addEventListener('load', function () {
                setSize();
                makeStars();
                var p0 = getPos(0);
                prevX = p0.x;
                prevY = p0.y;
                if (!started) { started = true; frame(); }
            });

            window.addEventListener('resize', function () {
                setSize();
                makeStars();
            });
        })();
    </script>

</body>
</html>
