<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM Portal — Register</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- FDM Register Styles (imports LoginPage.css automatically) -->
    <link rel="stylesheet" href="css/RegisterPage.css">
    <!-- Django: <link rel="stylesheet" href="{% static 'css/RegisterPage.css' %}"> -->

    <link rel="shortcut icon" href="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247">
</head>
<body>

    <!-- Rocket canvas background -->
    <canvas id="rocketCanvas"></canvas>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="top-bar-brand">
            <img src="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247" alt="FDM">
            FDM Group Portal
        </div>
        <div class="top-bar-hint">create account</div>
    </div>

    <!-- Main Content -->
    <div class="page-wrap">
        <div class="login-card">

            <!-- Brand Header -->
            <div class="card-brand">
                <img src="https://th.bing.com/th?q=FDM+Group+Company+Logo&w=120&h=120&c=1&rs=1&qlt=70&o=7&cb=1&dpr=1.5&pid=InlineBlock&rm=3&mkt=en-GB&cc=GB&setlang=en&adlt=strict&t=1&mw=247" alt="FDM Logo">
                <h1>Create account</h1>
                <p>Join the FDM Portal today</p>
            </div>

            <!-- Error messages — Django: uncomment when wiring up -->
            <!--
            {% if errors %}
            <div class="alert-fdm">
                <ul style="margin:0; padding-left:1rem;">
                    {% for field, error_list in errors.items %}
                        {% for error in error_list %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
            -->

            <form id="registerForm" method="post" novalidate>
                <!-- Django: {% csrf_token %} -->

                <!-- Email -->
                <div class="field-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email"
                           placeholder="you@fdmgroup.com"
                           autocomplete="email" required>
                </div>

                <!-- Username -->
                <div class="field-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Choose a username"
                           autocomplete="username" required>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password"
                               placeholder="Min. 8 characters"
                               autocomplete="new-password"
                               minlength="8" required>
                        <button type="button" class="toggle-pw" id="togglePw1" aria-label="Show password">👁</button>
                    </div>
                    <div class="strength-bar-wrap">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-label" id="strengthLabel"></div>
                </div>

                <!-- Confirm Password -->
                <div class="field-group">
                    <label for="password_confirm">Confirm password</label>
                    <div class="password-wrap">
                        <input type="password" id="password_confirm" name="password_confirm"
                               placeholder="Re-enter password"
                               autocomplete="new-password" required>
                        <button type="button" class="toggle-pw" id="togglePw2" aria-label="Show password">👁</button>
                    </div>
                    <div class="match-msg" id="matchMsg"></div>
                </div>

                <!-- Consultant checkbox -->
                <div class="check-group">
                    <input type="checkbox" id="is_consultant" name="is_consultant">
                    <label for="is_consultant">Register as Consultant</label>
                </div>

                <button type="submit" class="btn-signin">Create account</button>
            </form>

            <div class="divider"><span>or</span></div>

            <div class="register-row">
                Already have an account? <a href="LoginPage.html">Sign in</a>
            </div>

        </div>
    </div>

    <footer>
        Copyright &copy; 2026 FDM Portal. All rights reserved &nbsp;&nbsp;
        <a href="#">Privacy Policy</a> &nbsp;|&nbsp;
        <a href="#">Legal</a> &nbsp;|&nbsp;
        <a href="#">Site Map</a> &nbsp; UK
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Django: <script src="{% static 'js/register.js' %}"></script> -->

    <script>
        /* ── Password toggles ── */
        function makePwToggle(btnId, inputId) {
            document.getElementById(btnId).addEventListener('click', function () {
                var pw = document.getElementById(inputId);
                var hidden = pw.type === 'password';
                pw.type = hidden ? 'text' : 'password';
                this.textContent = hidden ? '🙈' : '👁';
            });
        }
        makePwToggle('togglePw1', 'password');
        makePwToggle('togglePw2', 'password_confirm');

        /* ── Password strength indicator ── */
        var pwInput    = document.getElementById('password');
        var strengthBar   = document.getElementById('strengthBar');
        var strengthLabel = document.getElementById('strengthLabel');

        pwInput.addEventListener('input', function () {
            var val = this.value;
            var score = 0;
            if (val.length >= 8)               score++;
            if (/[A-Z]/.test(val))             score++;
            if (/[0-9]/.test(val))             score++;
            if (/[^A-Za-z0-9]/.test(val))      score++;

            var pct   = ['0%', '25%', '50%', '75%', '100%'][score];
            var color = ['#ff4444', '#ff8800', '#ffcc00', '#88cc00', '#c8fd14'][score];
            var label = ['', 'Weak', 'Fair', 'Good', 'Strong'][score];

            strengthBar.style.width      = pct;
            strengthBar.style.background = color;
            strengthLabel.textContent    = label;
            strengthLabel.style.color    = color;
        });

        /* ── Confirm password match ── */
        var confirmInput = document.getElementById('password_confirm');
        var matchMsg     = document.getElementById('matchMsg');

        function checkMatch() {
            if (!confirmInput.value) { matchMsg.textContent = ''; return; }
            if (confirmInput.value === pwInput.value) {
                matchMsg.textContent = '✓ Passwords match';
                matchMsg.className   = 'match-msg ok';
            } else {
                matchMsg.textContent = '✗ Passwords do not match';
                matchMsg.className   = 'match-msg fail';
            }
        }
        confirmInput.addEventListener('input', checkMatch);
        pwInput.addEventListener('input', checkMatch);

        /* ══════════════════════════════════════
           ROCKET CANVAS — same bulletproof loop
        ══════════════════════════════════════ */
        (function () {
            var canvas = document.getElementById('rocketCanvas');
            var ctx = canvas.getContext('2d');
            var W = 0, H = 0;
            var stars = [], trail = [];
            var t = 0, flameT = 0;
            var prevX = 0, prevY = 0, angle = 0;
            var started = false;

            function setSize() {
                W = canvas.width  = window.innerWidth;
                H = canvas.height = window.innerHeight;
            }

            function makeStars() {
                stars = [];
                for (var i = 0; i < 130; i++) {
                    stars.push({
                        x:     Math.random() * W,
                        y:     Math.random() * H,
                        r:     Math.random() * 1.4 + 0.3,
                        alpha: Math.random(),
                        spd:   (Math.random() * 0.012 + 0.003) * (Math.random() < 0.5 ? 1 : -1)
                    });
                }
            }

            function getPos(tt) {
                var scale = Math.min(W, H) * 0.36;
                var d = 1 + Math.sin(tt) * Math.sin(tt);
                return {
                    x: W / 2 + scale * Math.cos(tt) / d,
                    y: H / 2 + scale * Math.sin(tt) * Math.cos(tt) / d
                };
            }

            function drawRocket(rx, ry, ang) {
                ctx.save();
                ctx.translate(rx, ry);
                ctx.rotate(ang + Math.PI / 2);
                var rw = 10, rh = 24;
                var ff = 0.7 + Math.sin(flameT) * 0.3;

                var fg = ctx.createLinearGradient(0, rh * 0.4, 0, rh * 0.4 + 22 * ff);
                fg.addColorStop(0,   'rgba(200,253,20,0.95)');
                fg.addColorStop(0.5, 'rgba(255,150,0,0.75)');
                fg.addColorStop(1,   'rgba(255,50,0,0)');
                ctx.beginPath();
                ctx.moveTo(-rw * 0.35, rh * 0.4);
                ctx.quadraticCurveTo(0, rh * 0.4 + 22 * ff, rw * 0.35, rh * 0.4);
                ctx.fillStyle = fg;
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -rh / 2);
                ctx.quadraticCurveTo( rw * 0.8, 0,  rw * 0.6,  rh * 0.4);
                ctx.lineTo(-rw * 0.6, rh * 0.4);
                ctx.quadraticCurveTo(-rw * 0.8, 0, 0, -rh / 2);
                ctx.fillStyle = '#d0d0d0';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(0, -rh / 2);
                ctx.quadraticCurveTo( rw * 0.4, -rh * 0.1,  rw * 0.2, rh * 0.05);
                ctx.lineTo(-rw * 0.2, rh * 0.05);
                ctx.quadraticCurveTo(-rw * 0.4, -rh * 0.1, 0, -rh / 2);
                ctx.fillStyle = '#c8fd14';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(0, rh * 0.05, rw * 0.22, 0, Math.PI * 2);
                ctx.fillStyle = '#1e1e1e';
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-rw * 0.06, rh * 0.02, rw * 0.1, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200,253,20,0.5)';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(-rw * 0.55, rh * 0.2);
                ctx.lineTo(-rw * 1.15, rh * 0.52);
                ctx.lineTo(-rw * 0.6,  rh * 0.42);
                ctx.closePath();
                ctx.fillStyle = '#c8fd14';
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo( rw * 0.55, rh * 0.2);
                ctx.lineTo( rw * 1.15, rh * 0.52);
                ctx.lineTo( rw * 0.6,  rh * 0.42);
                ctx.closePath();
                ctx.fillStyle = '#c8fd14';
                ctx.fill();

                ctx.restore();
            }

            function frame() {
                requestAnimationFrame(frame);
                try {
                    ctx.clearRect(0, 0, W, H);

                    for (var i = 0; i < stars.length; i++) {
                        var s = stars[i];
                        s.alpha += s.spd;
                        if (s.alpha >= 1) { s.alpha = 1; s.spd = -Math.abs(s.spd); }
                        if (s.alpha <= 0) { s.alpha = 0; s.spd =  Math.abs(s.spd); }
                        ctx.beginPath();
                        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255,255,255,' + s.alpha + ')';
                        ctx.fill();
                    }

                    t += 0.004;
                    var pos = getPos(t);
                    angle = Math.atan2(pos.y - prevY, pos.x - prevX);
                    prevX = pos.x;
                    prevY = pos.y;

                    trail.push({ x: pos.x, y: pos.y, life: 1.0, r: Math.random() * 2.5 + 1 });
                    for (var j = trail.length - 1; j >= 0; j--) {
                        trail[j].life -= 0.03;
                        if (trail[j].life <= 0) { trail.splice(j, 1); continue; }
                        ctx.beginPath();
                        ctx.arc(trail[j].x, trail[j].y, trail[j].r * trail[j].life, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(200,253,20,' + (trail[j].life * 0.4) + ')';
                        ctx.fill();
                    }

                    flameT += 0.18;
                    drawRocket(pos.x, pos.y, angle);
                } catch (e) { /* keep looping no matter what */ }
            }

            window.addEventListener('load', function () {
                setSize();
                makeStars();
                var p0 = getPos(0);
                prevX = p0.x;
                prevY = p0.y;
                if (!started) { started = true; frame(); }
            });

            window.addEventListener('resize', function () {
                setSize();
                makeStars();
            });
        })();
    </script>

</body>
</html>
