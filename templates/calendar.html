<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM Employee Portal - Calendar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #1e1e1e; color: #f0f0f0; font-family: Arial, sans-serif; }

        .navbar { background-color: #111111; border-bottom: 1px solid #2e2e2e; }
        .navbar-brand { color: #c8fd14 !important; font-weight: bold; font-size: 1.4rem; }
        .nav-link { color: #9ca3af !important; }
        .nav-link:hover { color: #f0f0f0 !important; }
        .nav-link.active { color: #c8fd14 !important; }

        .page-heading { padding: 2rem 0 1.25rem 0; }
        .page-heading h1 { font-size: 2rem; font-weight: bold; }
        .green-text { color: #c8fd14; }
        .heading-divider {
            height: 2px; background: linear-gradient(to right, #c8fd14, transparent);
            border: none; margin: 1rem 0 1.5rem 0; opacity: 0.4;
        }

        /* calendar controls */
        .cal-controls {
            display: flex; align-items: center; gap: 1rem;
            flex-wrap: wrap; margin-bottom: 1rem;
        }
        .cal-month-label { font-size: 1.25rem; font-weight: bold; min-width: 160px; text-align: center; }
        .nav-btn {
            background: #242424; border: 1px solid #3a3a3a; border-radius: 6px;
            color: #f0f0f0; width: 34px; height: 34px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 0.8rem;
        }
        .nav-btn:hover { border-color: #c8fd14; color: #c8fd14; }
        .today-btn {
            background: none; border: 1px solid #3a3a3a; border-radius: 6px;
            color: #9ca3af; font-size: 0.75rem; padding: 5px 14px; cursor: pointer;
        }
        .today-btn:hover { border-color: #c8fd14; color: #c8fd14; }

        /* staff filter */
        .filter-select {
            background: #242424; border: 1px solid #3a3a3a; border-radius: 6px;
            color: #f0f0f0; font-size: 0.8rem; padding: 5px 10px; cursor: pointer;
        }
        .filter-select:focus { outline: none; border-color: #c8fd14; }

        /* day headers */
        .day-headers {
            display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 2px; margin-bottom: 2px;
        }
        .day-header {
            text-align: center; font-size: 0.65rem; color: #555;
            text-transform: uppercase; letter-spacing: 1px; padding: 0.4rem 0;
        }

        /* calendar grid */
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }

        .day-cell {
            background: #242424; border: 1px solid #2e2e2e; border-radius: 6px;
            min-height: 90px; padding: 0.4rem; overflow: hidden;
        }
        .day-cell.other-month { opacity: 0.3; }
        .day-cell.is-today  { border-color: #c8fd14; }
        .day-cell.is-weekend { background: #1a1a1a; }
        .day-cell.has-bank  { border-color: rgba(248,113,113,0.45); }

        .day-num {
            font-size: 0.72rem; color: #666; margin-bottom: 0.25rem;
            display: flex; align-items: center; justify-content: flex-end;
        }
        .today-bubble {
            background: #c8fd14; color: #1e1e1e; border-radius: 50%;
            width: 20px; height: 20px; display: flex; align-items: center;
            justify-content: center; font-weight: bold; font-size: 0.7rem;
        }

        /* event pills */
        .pill {
            font-size: 0.62rem; border-radius: 3px; padding: 1px 5px;
            margin-bottom: 2px; white-space: nowrap; overflow: hidden;
            text-overflow: ellipsis; display: block; cursor: default;
        }
        .pill-bank     { background: rgba(248,113,113,0.12); color: #f87171; border: 1px solid rgba(248,113,113,0.28); }
        .pill-shift    { background: rgba(200,253,20,0.10);  color: #c8fd14; border: 1px solid rgba(200,253,20,0.25); }
        .pill-approved { background: rgba(134,239,172,0.10); color: #86efac; border: 1px solid rgba(134,239,172,0.25); }
        .pill-pending  { background: rgba(252,211,77,0.10);  color: #fcd34d; border: 1px solid rgba(252,211,77,0.25); }
        .pill-absence  { background: rgba(167,139,250,0.10); color: #a78bfa; border: 1px solid rgba(167,139,250,0.25); }

        /* legend */
        .legend { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
        .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; color: #9ca3af; }
        .legend-dot { width: 10px; height: 10px; border-radius: 2px; }

        .loading-msg { color: #555; font-size: 0.875rem; padding: 3rem; text-align: center; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">FDM Portal</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="border-color:#3a3a3a;">
            <span class="navbar-toggler-icon" style="filter:invert(1);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/homepage">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="/profile">My Profile</a></li>
                <li class="nav-item"><a class="nav-link active" href="#">Calendar</a></li>
                <li class="nav-item"><a class="nav-link" href="/holiday">Book Leave</a></li>
                <li class="nav-item"><a class="nav-link" href="/support">Support</a></li>
            </ul>
            <div style="display:flex; align-items:center; gap:10px;">
                <div id="navAvatar" style="width:32px; height:32px; background:#c8fd14; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#1e1e1e; font-weight:bold; font-size:0.8rem;">U</div>
                <span id="navWelcomeName" style="font-size:0.875rem; color:#9ca3af;">Welcome, User</span>
                <a href="/logout" style="font-size:0.8rem; color:#555; text-decoration:none; margin-left:8px;">Log out</a>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="page-heading">
        <h1>Team <span class="green-text">Calendar</span></h1>
        <p style="color:#9ca3af; margin-top:0.4rem;">Shifts, holidays, and bank holidays at a glance</p>
        <hr class="heading-divider">
    </div>

    <!-- controls -->
    <div class="cal-controls">
        <button class="nav-btn" id="prevBtn" onclick="changeMonth(-1)"><i class="fas fa-chevron-left"></i></button>
        <span class="cal-month-label" id="monthLabel">—</span>
        <button class="nav-btn" id="nextBtn" onclick="changeMonth(1)"><i class="fas fa-chevron-right"></i></button>
        <button class="today-btn" onclick="goToday()">Today</button>
        <select class="filter-select" id="employeeFilter" style="display:none;" onchange="onFilterChange()">
            <option value="">All employees</option>
        </select>
    </div>

    <!-- legend -->
    <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#c8fd14;"></div> Shift</div>
        <div class="legend-item"><div class="legend-dot" style="background:#86efac;"></div> Holiday (approved)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#fcd34d;"></div> Holiday (pending)</div>
        <div class="legend-item"><div class="legend-dot" style="background:#a78bfa;"></div> Absence</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f87171;"></div> Bank holiday</div>
    </div>

    <!-- day headers -->
    <div class="day-headers">
        <div class="day-header">Mon</div>
        <div class="day-header">Tue</div>
        <div class="day-header">Wed</div>
        <div class="day-header">Thu</div>
        <div class="day-header">Fri</div>
        <div class="day-header" style="color:#444;">Sat</div>
        <div class="day-header" style="color:#444;">Sun</div>
    </div>

    <div class="cal-grid" id="calGrid">
        <div class="loading-msg" style="grid-column:1/-1;">Loading calendar…</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    var currentUser = null;
    var viewYear  = new Date().getFullYear();
    var viewMonth = new Date().getMonth(); // 0-indexed
    var calData   = null;

    // ── helpers ──────────────────────────────────────────────────────────────

    function pad(n) { return String(n).padStart(2, '0'); }

    function monthStart(y, m) { return `${y}-${pad(m + 1)}-01`; }
    function monthEnd(y, m) {
        return `${y}-${pad(m + 1)}-${pad(new Date(y, m + 1, 0).getDate())}`;
    }

    function fmtMonthLabel(y, m) {
        return new Date(y, m, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    }

    function toDateStr(d) {
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    function fmtTime(t) { return t ? t.slice(0, 5) : ''; }

    // ── event map ─────────────────────────────────────────────────────────────
    // Builds { 'YYYY-MM-DD': [event, …] } so the renderer can look up by date.

    function buildEventMap(data) {
        const map = {};
        function add(dateStr, event) {
            if (!map[dateStr]) map[dateStr] = [];
            map[dateStr].push(event);
        }

        (data.bank_holidays || []).forEach(bh => {
            add(bh.date, { type: 'bank', name: bh.name });
        });

        (data.shifts || []).forEach(s => {
            add(s.date, { type: 'shift', start: s.start_time, end: s.end_time, employee: s.employee_name });
        });

        (data.holidays || []).forEach(h => {
            // expand multi-day ranges onto each individual date
            const cur = new Date(h.start_date + 'T00:00:00');
            const end = new Date(h.end_date   + 'T00:00:00');
            while (cur <= end) {
                add(toDateStr(cur), {
                    type: 'holiday',
                    request_type: h.request_type,
                    status: h.status,
                    employee: h.employee_name,
                });
                cur.setDate(cur.getDate() + 1);
            }
        });

        return map;
    }

    // ── render ────────────────────────────────────────────────────────────────

    function renderCalendar(y, m, eventMap) {
        document.getElementById('monthLabel').textContent = fmtMonthLabel(y, m);

        const firstDay  = new Date(y, m, 1);
        const lastDay   = new Date(y, m + 1, 0);
        const today     = toDateStr(new Date());

        // Pad so the grid starts on Monday (getDay(): 0=Sun,1=Mon…)
        const padStart  = (firstDay.getDay() + 6) % 7;
        const totalRows = Math.ceil((padStart + lastDay.getDate()) / 7);

        const gridStart = new Date(firstDay);
        gridStart.setDate(gridStart.getDate() - padStart);

        let html = '';
        for (let i = 0; i < totalRows * 7; i++) {
            const d        = new Date(gridStart);
            d.setDate(d.getDate() + i);
            const dateStr  = toDateStr(d);
            const isCurMon = d.getMonth() === m;
            const isToday  = dateStr === today;
            const isWkend  = d.getDay() === 0 || d.getDay() === 6;
            const events   = eventMap[dateStr] || [];
            const hasBank  = events.some(e => e.type === 'bank');

            let cls = 'day-cell';
            if (!isCurMon) cls += ' other-month';
            if (isToday)   cls += ' is-today';
            if (isWkend)   cls += ' is-weekend';
            if (hasBank)   cls += ' has-bank';

            const numHtml = isToday
                ? `<div class="day-num"><span class="today-bubble">${d.getDate()}</span></div>`
                : `<div class="day-num">${d.getDate()}</div>`;

            const pills = events.map(e => {
                if (e.type === 'bank') {
                    return `<span class="pill pill-bank" title="${e.name}"><i class="fas fa-umbrella-beach"></i> ${e.name}</span>`;
                }
                if (e.type === 'shift') {
                    return `<span class="pill pill-shift" title="${e.employee || ''}"><i class="fas fa-clock"></i> ${fmtTime(e.start)}–${fmtTime(e.end)}</span>`;
                }
                if (e.type === 'holiday') {
                    if (e.request_type === 'absence') {
                        return `<span class="pill pill-absence" title="${e.employee || ''}"><i class="fas fa-user-minus"></i> ${e.employee ? e.employee.split(' ')[0] + ': ' : ''}Absence</span>`;
                    }
                    const cls2 = e.status === 'approved' ? 'pill-approved' : 'pill-pending';
                    return `<span class="pill ${cls2}" title="${e.employee || ''}"><i class="fas fa-sun"></i> ${e.employee ? e.employee.split(' ')[0] + ': ' : ''}Holiday</span>`;
                }
                return '';
            }).join('');

            html += `<div class="${cls}">${numHtml}${pills}</div>`;
        }

        document.getElementById('calGrid').innerHTML = html;
    }

    // ── data fetching ─────────────────────────────────────────────────────────

    async function loadCalendar() {
        document.getElementById('calGrid').innerHTML =
            '<div class="loading-msg" style="grid-column:1/-1;">Loading…</div>';

        const start    = monthStart(viewYear, viewMonth);
        const end      = monthEnd(viewYear, viewMonth);
        const filterId = document.getElementById('employeeFilter').value;

        let url = `/api/calendar/?start=${start}&end=${end}`;
        if (filterId) url += `&user_id=${filterId}`;

        const res = await fetch(url, { credentials: 'include' });
        if (!res.ok) {
            document.getElementById('calGrid').innerHTML =
                '<div class="loading-msg" style="grid-column:1/-1; color:#f87171;">Failed to load calendar.</div>';
            return;
        }
        calData = await res.json();
        renderCalendar(viewYear, viewMonth, buildEventMap(calData));
    }

    async function loadEmployeeFilter() {
        if (!currentUser?.is_staff) return;
        const res = await fetch('/api/profiles/all/?page_size=100', { credentials: 'include' });
        if (!res.ok) return;
        const data = await res.json();
        const select = document.getElementById('employeeFilter');
        (data.results || []).forEach(p => {
            const name = [p.user?.first_name, p.user?.last_name].filter(Boolean).join(' ') || p.user?.email;
            const opt  = document.createElement('option');
            opt.value  = p.user?.id;
            opt.textContent = name;
            select.appendChild(opt);
        });
        select.style.display = 'block';
    }

    // ── controls ──────────────────────────────────────────────────────────────

    function changeMonth(delta) {
        viewMonth += delta;
        if (viewMonth > 11) { viewMonth = 0;  viewYear++; }
        if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
        loadCalendar();
    }

    function goToday() {
        viewYear  = new Date().getFullYear();
        viewMonth = new Date().getMonth();
        loadCalendar();
    }

    function onFilterChange() { loadCalendar(); }

    // ── init ──────────────────────────────────────────────────────────────────

    async function init() {
        try {
            const res = await fetch('/api/auth/me/', { credentials: 'include' });
            if (!res.ok) { window.location.href = '/'; return; }
            currentUser = await res.json();

            const initials = ((currentUser.first_name?.[0] || '') + (currentUser.last_name?.[0] || '')).toUpperCase()
                          || currentUser.email[0].toUpperCase();
            document.getElementById('navAvatar').textContent = initials;
            document.getElementById('navWelcomeName').textContent =
                'Welcome, ' + (currentUser.first_name || currentUser.email);

            await Promise.all([loadEmployeeFilter(), loadCalendar()]);
        } catch {
            window.location.href = '/';
        }
    }

    init();
</script>
</body>
</html>
