<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FDM Employee Portal - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1e1e1e;
            color: #f0f0f0;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background-color: #242424;
            border: 1px solid #2e2e2e;
            border-radius: 12px;
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }
        .brand {
            color: #c8fd14;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }
        .divider {
            height: 2px;
            background: linear-gradient(to right, #c8fd14, transparent);
            border: none;
            margin: 0 0 1.5rem 0;
            opacity: 0.3;
        }
        .form-label {
            color: #9ca3af;
            font-size: 0.75rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-control {
            background-color: #1e1e1e;
            border: 1px solid #3a3a3a;
            color: #f0f0f0;
            border-radius: 6px;
            padding: 10px 12px;
        }
        .form-control:focus {
            background-color: #1e1e1e;
            border-color: #c8fd14;
            color: #f0f0f0;
            box-shadow: none;
        }
        .form-control::placeholder { color: #555; }
        .btn-login {
            background-color: #c8fd14;
            border: none;
            color: #1e1e1e;
            font-weight: bold;
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .btn-login:hover { opacity: 0.88; }
        .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
        .error-msg {
            background-color: rgba(220, 38, 38, 0.1);
            border: 1px solid rgba(220, 38, 38, 0.3);
            color: #f87171;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 0.85rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">FDM Portal</div>
        <div class="subtitle">Employee self-service portal</div>
        <hr class="divider">

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" placeholder="you@fdm.com" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-login" id="loginBtn">Sign in</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>
    </div>

    <script>
        function getCookie(name) {
            let val = null;
            document.cookie.split(';').forEach(c => {
                const t = c.trim();
                if (t.startsWith(name + '=')) val = decodeURIComponent(t.slice(name.length + 1));
            });
            return val;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');

            btn.textContent = 'Signing in…';
            btn.disabled = true;
            errorMsg.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });

                const data = await res.json();

                if (res.ok) {
                    window.location.href = '/homepage';
                } else {
                    const msg = data.non_field_errors ? data.non_field_errors[0] : 'Login failed. Please check your credentials.';
                    errorMsg.textContent = msg;
                    errorMsg.style.display = 'block';
                    btn.textContent = 'Sign in';
                    btn.disabled = false;
                }
            } catch {
                errorMsg.textContent = 'Connection error. Please try again.';
                errorMsg.style.display = 'block';
                btn.textContent = 'Sign in';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
